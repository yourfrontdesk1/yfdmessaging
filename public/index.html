<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourFrontDesk</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --primary: #000000;
            --accent: #4F46E5;
            --success: #10B981;
            --warning: #F59E0B;
            --danger: #EF4444;
            --gray-50: #F9FAFB;
            --gray-100: #F3F4F6;
            --gray-200: #E5E7EB;
            --gray-300: #D1D5DB;
            --gray-400: #9CA3AF;
            --gray-500: #6B7280;
            --gray-600: #4B5563;
            --gray-700: #374151;
            --gray-800: #1F2937;
            --gray-900: #111827;
            --sidebar-width: 260px;
        }
        body { font-family: 'Inter', sans-serif; background: var(--gray-50); color: var(--gray-900); min-height: 100vh; }
        .sidebar { position: fixed; left: 0; top: 0; bottom: 0; width: var(--sidebar-width); background: #fff; border-right: 1px solid var(--gray-200); display: flex; flex-direction: column; z-index: 100; }
        .logo-container { padding: 20px; border-bottom: 1px solid var(--gray-200); font-size: 20px; font-weight: 700; }
        .nav-menu { flex: 1; padding: 16px 12px; }
        .nav-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 8px; color: var(--gray-600); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer; margin-bottom: 4px; }
        .nav-item:hover { background: var(--gray-100); }
        .nav-item.active { background: var(--gray-900); color: #fff; }
        .main-content { margin-left: var(--sidebar-width); min-height: 100vh; }
        .header { background: #fff; border-bottom: 1px solid var(--gray-200); padding: 16px 32px; display: flex; align-items: center; justify-content: space-between; }
        .header-title { font-size: 24px; font-weight: 700; }
        .page-content { padding: 32px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: #fff; border-radius: 12px; padding: 24px; border: 1px solid var(--gray-200); }
        .stat-card.highlight { background: var(--gray-900); color: #fff; }
        .stat-label { font-size: 13px; color: var(--gray-500); margin-bottom: 8px; }
        .stat-card.highlight .stat-label { color: var(--gray-400); }
        .stat-value { font-size: 32px; font-weight: 700; }
        .card { background: #fff; border-radius: 12px; border: 1px solid var(--gray-200); margin-bottom: 24px; }
        .card-header { padding: 20px 24px; border-bottom: 1px solid var(--gray-200); font-weight: 600; }
        .card-body { padding: 24px; }
        .booking-item { display: flex; align-items: center; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--gray-100); }
        .booking-item:last-child { border-bottom: none; }
        .avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--gray-200); display: flex; align-items: center; justify-content: center; font-weight: 600; }
        .booking-info { flex: 1; }
        .booking-guest { font-weight: 600; font-size: 14px; }
        .booking-dates { font-size: 13px; color: var(--gray-500); }
        .btn { padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; border: none; }
        .btn-primary { background: var(--gray-900); color: #fff; }
        .account-switcher { padding: 16px; border-top: 1px solid var(--gray-200); }
        .account-dropdown { width: 100%; padding: 10px; border: 1px solid var(--gray-200); border-radius: 8px; font-size: 14px; }
        .loading { text-align: center; padding: 40px; color: var(--gray-400); }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo-container">YourFrontDesk</div>
        <nav class="nav-menu">
            <a class="nav-item active" onclick="showPage('dashboard')">Dashboard</a>
            <a class="nav-item" onclick="showPage('messages')">Messages</a>
            <a class="nav-item" onclick="showPage('bookings')">Bookings</a>
            <a class="nav-item" onclick="showPage('properties')">Properties</a>
            <a class="nav-item" onclick="showPage('settings')">Settings</a>
        </nav>
        <div class="account-switcher">
            <select class="account-dropdown" id="account-select" onchange="switchAccount(this.value)"></select>
        </div>
    </aside>
    <main class="main-content">
        <header class="header">
            <h1 class="header-title" id="page-title">Dashboard</h1>
            <button class="btn btn-primary" onclick="refreshData()">Refresh</button>
        </header>
        <div class="page-content">
            <div id="page-dashboard">
                <div class="stats-grid">
                    <div class="stat-card highlight"><div class="stat-label">Revenue</div><div class="stat-value" id="stat-revenue">--</div></div>
                    <div class="stat-card"><div class="stat-label">Check-ins Today</div><div class="stat-value" id="stat-checkins">--</div></div>
                    <div class="stat-card"><div class="stat-label">Check-outs Today</div><div class="stat-value" id="stat-checkouts">--</div></div>
                    <div class="stat-card"><div class="stat-label">Active Stays</div><div class="stat-value" id="stat-active">--</div></div>
                </div>
                <div class="card"><div class="card-header">Upcoming Bookings</div><div class="card-body" id="bookings-list"><div class="loading">Loading...</div></div></div>
            </div>
        </div>
    </main>
    <script>
        const DEFAULT_ACCOUNTS = [{ id: '1', name: 'Ocean Heights', apiKey: 'B1r7Y46f1A0oD88WM7H3t5YTybsCfUXecPMNiAhLvW' }];
        function getAccounts() { return JSON.parse(localStorage.getItem('smoobu_accounts') || 'null') || DEFAULT_ACCOUNTS; }
        function getActiveAccount() { const accounts = getAccounts(); const id = localStorage.getItem('active_account_id'); return accounts.find(a => a.id === id) || accounts[0]; }
        function switchAccount(id) { localStorage.setItem('active_account_id', id); refreshData(); }
        function getHeaders() { return { 'Content-Type': 'application/json', 'X-Api-Key': getActiveAccount().apiKey }; }
        async function fetchStats() {
            try {
                const r = await fetch('/api/stats', { headers: getHeaders() });
                const d = await r.json();
                document.getElementById('stat-revenue').textContent = '€' + (d.month_revenue || 0).toLocaleString();
                document.getElementById('stat-checkins').textContent = d.today_checkins || 0;
                document.getElementById('stat-checkouts').textContent = d.today_checkouts || 0;
                document.getElementById('stat-active').textContent = d.active_stays || 0;
            } catch(e) { console.error(e); }
        }
        async function fetchBookings() {
            try {
                const r = await fetch('/api/bookings', { headers: getHeaders() });
                const d = await r.json();
                const list = document.getElementById('bookings-list');
                if (!d.bookings?.length) { list.innerHTML = '<p>No upcoming bookings</p>'; return; }
                list.innerHTML = d.bookings.slice(0, 10).map(b => `<div class="booking-item"><div class="avatar">${(b.guest_name||'G')[0]}</div><div class="booking-info"><div class="booking-guest">${b.guest_name||'Guest'}</div><div class="booking-dates">${b.checkin} - ${b.checkout}</div></div></div>`).join('');
            } catch(e) { document.getElementById('bookings-list').innerHTML = '<p>Error loading bookings</p>'; }
        }
        function showPage(page) {
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('page-title').textContent = page.charAt(0).toUpperCase() + page.slice(1);
        }
        function refreshData() { fetchStats(); fetchBookings(); }
        function initAccounts() {
            const select = document.getElementById('account-select');
            const accounts = getAccounts();
            const active = getActiveAccount();
            select.innerHTML = accounts.map(a => `<option value="${a.id}" ${a.id === active.id ? 'selected' : ''}>${a.name}</option>`).join('');
        }
        document.addEventListener('DOMContentLoaded', () => { initAccounts(); refreshData(); });
    </script>
</body>
</html>
